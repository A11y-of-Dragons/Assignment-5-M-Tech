name: Task Tracker CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Task Tracker code
      uses: actions/checkout@v4
    
    - name: Set up Node.js for Task Tracker
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
    
    - name: Install Task Tracker backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Install Task Tracker frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Test Task Tracker API
      run: |
        cd backend
        npm test
    
    - name: Test Task Tracker frontend
      run: |
        cd frontend
        npm test
    
   
    - name: Build and push Task Tracker backend
      if: success()
      run: |
        cd backend
        docker build -t latest.
        docker push
    
   
    
    - name: Get Task Tracker URLs
      if: success()
      run: |
        echo "Task Tracker Backend: $(task-backend --format='value(status.url)')"
        echo "Task Tracker Frontend: $(task-frontend --format='value(status.url)')"
name: Recipe App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run backend tests
      run: |
        cd backend
        npm test
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
    
    
    
    - name: Build and push backend image
      if: success()
      run: |
        cd backend
        docker build -t recipe-backend:${{ github.sha }} .
        docker push recipe-backend:${{ github.sha }}
    
    - name: Build and push frontend image
      if: success()
      run: |
        cd frontend
        # Get the backend URL for the frontend build
        BACKEND_URL=$( recipe-backend --format='value(status.url)' 2>/dev/null || echo "https://recipe-backend-placeholder.run.app")
        docker build --build-arg VITE_API_URL=$BACKEND_URL -t recipe-frontend:${{ github.sha }} .
        docker push recipe-frontend:${{ github.sha }}
    
   
    - name: Get deployed URLs
      if: success()
      run: |
        echo "Backend URL: $(recipe-backend --region=${{ secrets.GCP_REGION }} --format='value(status.url)')"
        echo "Frontend URL: $(recipe-frontend --region=${{ secrets.GCP_REGION }} --format='value(status.url)')"